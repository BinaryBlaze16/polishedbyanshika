# ==============================================================================
# Nginx Configuration — PolishedByAnshika (Production EC2 Deployment)
# File Location on Server: /etc/nginx/sites-available/polishedbyanshika.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name polishedbyanshika.com www.polishedbyanshika.com;

    # Hide Nginx version for security
    server_tokens off;

    # ─── 1. Request Body Size Limit ───────────────────────────────────────────
    # Supports up to 10MB payloads (accommodates 5MB image uploads + form metadata)
    client_max_body_size 10M;

    # ─── 2. Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # ─── 3. Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── 4. Frontend Serving (Vite React Build) ───────────────────────────────
    root /var/www/polishedbyanshika/client/dist;
    index index.html;

    # SPA Routing: Fall back to index.html for client-side React routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Strategy: index.html must NEVER be cached (ensures instant deployment updates)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache Strategy: Static build assets with content hashes (/assets/*.js, *.css, etc.)
    # Cached aggressively for 1 year with immutable flag
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache Strategy: Standalone media, webfonts, and favicons (cached 30 days)
    location ~* \.(?:ico|png|jpg|jpeg|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ─── 5. Backend API Reverse Proxy ─────────────────────────────────────────
    # Routes all /api/ traffic to Express running on local port 5001
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;

        # WebSocket & connection keep-alive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard forward headers for real client identification
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and cache bypass for live API responses
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Extended timeouts for multipart file uploads
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Deny access to hidden files (e.g., .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

